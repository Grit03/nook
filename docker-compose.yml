services:
  mysql:
    image: mysql:8.4
    container_name: nook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nook
      MYSQL_USER: nook
      MYSQL_PASSWORD: nook
    ports:
      - '3307:3306'
    volumes:
      - nook-mysql:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: nook-redis
    ports:
      - '6380:6379'
volumes:
  nook-mysql:
